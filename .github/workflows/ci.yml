name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-sonar:
    name: Build, tests y SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compilar y ejecutar pruebas (con cobertura JaCoCo)
        run: mvn -B verify

      - name: Analisis SonarCloud (falla si el Quality Gate no pasa)
        if: env.SONAR_TOKEN != ''
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar
          -Dsonar.qualitygate.wait=true

  mutation-testing:
    name: Mutation Testing (PIT)
    runs-on: ubuntu-latest
    needs: build-and-sonar
    permissions:
      contents: write # solo para publicar el badge en la rama "badges"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # El build FALLA si el Mutation Score es menor a 50 % (mutationThreshold en el pom)
      - name: Ejecutar PIT
        run: mvn -B test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Resumen de mutantes
        if: always()
        run: python3 scripts/mutation_report.py target/pit-reports/mutations.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reporte HTML de PIT
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-report
          path: target/pit-reports

      - name: Publicar badge del Mutation Score
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python3 scripts/mutation_report.py target/pit-reports/mutations.xml --badge mutation.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badges
          git rm -rf . > /dev/null
          git add mutation.json
          git commit -m "Actualizar badge de mutation score"
          git push --force origin badges
