# Perfil de pruebas: se activa con @ActiveProfiles("test").
# Completa (no reemplaza) a src/main/resources/application.properties.

# --- Base de datos en memoria para pruebas ---
spring.datasource.url=jdbc:h2:mem:tournaments;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.openai.api-key=
app.opendata.sources[0].key=datos-gov-co
app.opendata.sources[0].display-name=datos.gov.co
app.opendata.sources[0].base-url=http://localhost:9
app.opendata.sources[0].dataset-id=test
app.opendata.sources[0].numeric-field=valor
app.opendata.sources[0].category-field=categoria
app.opendata.sources[1].key=dane
app.opendata.sources[1].display-name=DANE
app.opendata.sources[1].base-url=http://localhost:9
app.opendata.sources[1].dataset-id=test
app.opendata.sources[1].numeric-field=valor
app.opendata.sources[1].category-field=categoria

# Valores SOLO para pruebas automatizadas (no son credenciales reales)
app.jwt.secret=clave-de-prueba-con-mas-de-32-bytes-0123456789
app.seed.admin-password=AdminPrueba-2026!
app.seed.user-password=UserPrueba-2026!