spring.application.name=gestor-torneos

# --- Seguridad (OWASP API8:2023 - Security Misconfiguration) ---
# Nunca exponer trazas ni mensajes internos al cliente
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
# Rechazar campos desconocidos en el JSON (OWASP API3:2023 - mass assignment)
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- Secretos: SIEMPRE por variables de entorno, nunca en el codigo ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=900
app.seed.admin-password=${SEED_ADMIN_PASSWORD}
app.seed.user-password=${SEED_USER_PASSWORD}

# --- Anti fuerza bruta (OWASP API2:2023 / API4:2023) ---
app.security.max-failed-attempts=5
app.security.lock-minutes=15
