spring.application.name=gestor-torneos

# --- Seguridad (OWASP API8:2023 - Security Misconfiguration) ---
# Nunca exponer trazas ni mensajes internos al cliente
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
# Rechazar campos desconocidos en el JSON (OWASP API3:2023 - mass assignment)
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- Secretos: SIEMPRE por variables de entorno, nunca en el codigo ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=900
app.seed.admin-password=${SEED_ADMIN_PASSWORD}
app.seed.user-password=${SEED_USER_PASSWORD}

# --- Anti fuerza bruta (OWASP API2:2023 / API4:2023) ---
app.security.max-failed-attempts=5
app.security.lock-minutes=15

# --- Base de datos del modulo hexagonal (PostgreSQL) ---
# En local: docker compose. En produccion: variables de entorno de la PaaS.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/torneos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:torneos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

# --- Actuator: solo health, sin detalles internos (OWASP API8:2023) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Despliegue ---
# La PaaS (Render/Railway) inyecta PORT; en local se usa 8080
server.port=${PORT:8080}

# --- Asistente LLM (opcional: sin clave, el asistente responde que no esta configurado) ---
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4o}

# --- Datos abiertos (API Socrata: {base-url}/resource/{dataset-id}.json) ---
# Reemplace los IDs por los datasets reales de datos.gov.co y DANE.
# Si un dataset falla, la fuente se marca UNAVAILABLE y la API sigue respondiendo.
app.opendata.sources[0].key=datos-gov-co
app.opendata.sources[0].display-name=datos.gov.co
app.opendata.sources[0].base-url=${DATOS_GOV_CO_BASE_URL:https://www.datos.gov.co}
app.opendata.sources[0].dataset-id=${DATOS_GOV_CO_DATASET_ID:CAMBIAR_ID_DATASET}
app.opendata.sources[0].numeric-field=${DATOS_GOV_CO_NUMERIC_FIELD:valor}
app.opendata.sources[0].category-field=${DATOS_GOV_CO_CATEGORY_FIELD:categoria}
app.opendata.sources[1].key=dane
app.opendata.sources[1].display-name=DANE
app.opendata.sources[1].base-url=${DANE_BASE_URL:https://www.datos.gov.co}
app.opendata.sources[1].dataset-id=${DANE_DATASET_ID:CAMBIAR_ID_DATASET}
app.opendata.sources[1].numeric-field=${DANE_NUMERIC_FIELD:valor}
app.opendata.sources[1].category-field=${DANE_CATEGORY_FIELD:categoria}
