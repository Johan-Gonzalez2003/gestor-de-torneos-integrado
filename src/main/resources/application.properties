spring.application.name=gestor-torneos

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestor_torneos?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.version=OPENAPI_3_0
springdoc.swagger-ui.path=/swagger-ui.html

app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4o}

# Fuentes de datos abiertos colombianos (Socrata / SODA). Los IDs de dataset se confirman en datos.gov.co.
app.opendata.sources[0].key=datos-gov-co
app.opendata.sources[0].display-name=datos.gov.co
app.opendata.sources[0].base-url=${DATOS_GOV_CO_BASE_URL:https://www.datos.gov.co}
app.opendata.sources[0].dataset-id=${DATOS_GOV_CO_DATASET_ID:CAMBIAR_ID_DATASET}
app.opendata.sources[0].numeric-field=${DATOS_GOV_CO_NUMERIC_FIELD:CAMBIAR_CAMPO_NUMERICO}
app.opendata.sources[0].category-field=${DATOS_GOV_CO_CATEGORY_FIELD:CAMBIAR_CAMPO_CATEGORIA}

app.opendata.sources[1].key=dane
app.opendata.sources[1].display-name=DANE
app.opendata.sources[1].base-url=${DANE_BASE_URL:https://www.datos.gov.co}
app.opendata.sources[1].dataset-id=${DANE_DATASET_ID:CAMBIAR_ID_DATASET_DANE}
app.opendata.sources[1].numeric-field=${DANE_NUMERIC_FIELD:CAMBIAR_CAMPO_NUMERICO}
app.opendata.sources[1].category-field=${DANE_CATEGORY_FIELD:CAMBIAR_CAMPO_CATEGORIA}

logging.level.root=INFO
logging.level.com.tournamentmanager=INFO
